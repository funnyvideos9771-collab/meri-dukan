name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify main.dart
        run: |
          if [ ! -f lib/main.dart ]; then
            echo "::error::lib/main.dart file hi nahi mili! Repo me lib/main.dart banao."
            exit 1
          fi
          echo "::notice::main.dart lines: $(wc -l < lib/main.dart)"
          echo "::notice::pehli line: $(head -n 1 lib/main.dart)"
          if grep -q "speech_to_text" lib/main.dart; then
            echo "::error::lib/main.dart me PURANA MAX code hai. Meri Dukan wala code paste karo."
            exit 1
          fi

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --project-name dukan_app .

      - name: Write pubspec.yaml
        run: |
          rm -f pubspec.lock
          cat > pubspec.yaml <<'EOF'
          name: dukan_app
          description: Meri Dukan - stock aur munafa manager
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.3.2
          flutter:
            uses-material-design: true
          EOF

      - name: App name and minSdk
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Meri Dukan"/' android/app/src/main/AndroidManifest.xml
          f=$(ls android/app/build.gradle* | head -n 1)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f"

      - name: Get packages
        run: flutter pub get

      - name: Check Dart errors
        shell: bash
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze.log 2>&1 || true
          cat analyze.log | tail -n 40
          if grep -qE '^\s*error' analyze.log; then
            grep -E '^\s*error' analyze.log | head -n 8 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Build release APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee build.log

      - name: Show errors (sirf fail hone par)
        if: failure()
        run: |
          grep -n -E -A4 "What went wrong|error:|Error:|Could not" build.log | head -n 30 | while IFS= read -r l; do
            echo "::error::$l"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dukan-apk
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-release.apk
