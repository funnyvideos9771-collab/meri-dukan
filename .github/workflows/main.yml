name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Recreate Android project
        run: |
          rm -rf android
          flutter create --platforms=android --project-name dukan_app .

      - name: Write pubspec.yaml
        run: |
          rm -f pubspec.lock
          cat > pubspec.yaml <<'EOF'
          name: dukan_app
          description: Meri Dukan - stock aur munafa manager
          publish_to: 'none'
          version: 1.0.0+1
          environment:
            sdk: '>=3.4.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
            shared_preferences: ^2.3.2
          flutter:
            uses-material-design: true
          EOF

      - name: App name and minSdk
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Meri Dukan"/' android/app/src/main/AndroidManifest.xml
          f=$(ls android/app/build.gradle* | head -n 1)
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' "$f"

      - name: Get packages
        run: flutter pub get

      - name: Check Dart errors
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | grep -E "error" || true

      - name: Build release APK
        shell: bash
        run: flutter build apk --release 2>&1 | tee build.log

      - name: Show errors (sirf fail hone par)
        if: failure()
        run: |
          echo "=========== ASLI ERROR YAHAN HAI ==========="
          grep -n -E -B1 -A6 "lib/.*(Error|error)|Error:|What went wrong|Could not|FAILURE|Execution failed|AAPT|Duplicate|not found" build.log | head -120

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dukan-apk
          if-no-files-found: error
          path: build/app/outputs/flutter-apk/app-release.apk
